<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Sandi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Lexend:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <div
        style="
          font-family: var(--font-display);
          font-weight: 700;
          font-size: 22px;
          text-transform: uppercase;
        "
      >
        Sandi - Admin
      </div>
      <div>
        <a href="index.html">Kembali ke Portofolio</a>
      </div>
    </nav>

    <div class="admin-header">
      <h1>Kelola Projek</h1>
      <p>
        Tambah, lihat, atau hapus projek yang tampil di halaman portofolio
        publik.
      </p>
    </div>

    <div id="loginBox" class="admin-panel">
      <h3>Login Admin</h3>
      <input type="text" id="inputEmail" placeholder="Email" />
      <input type="password" id="inputPassword" placeholder="Password" />
      <button class="btn-publish" id="tombolLogin">Login</button>
      <p id="loginStatus"></p>
    </div>

    <div id="formTambahProjek" class="admin-panel" style="display: none">
      <h3>Tambah Projek Baru</h3>

      <div class="field-label">
        <span class="field-num num-pink">01</span> Nama Projek
      </div>
      <input type="text" id="inputNamaProjek" placeholder="mis. SIPINTAR" />

      <div class="field-label">
        <span class="field-num num-kuning">02</span> Deskripsi
      </div>
      <textarea
        id="inputDeskripsiProjek"
        placeholder="Ceritakan projek ini secara singkat"
      ></textarea>

      <div class="field-label">
        <span class="field-num num-lime">03</span> Link Projek (opsional)
      </div>
      <input
        type="text"
        id="inputUrlProjek"
        placeholder="https://github.com/... atau link demo"
      />

      <div class="field-label">
        <span class="field-num num-pink">04</span> Upload Gambar (opsional)
      </div>
      <input
        type="file"
        id="inputGambarFile"
        accept="image/*"
      />
      <p id="uploadStatus" style="font-size: 14px; color: var(--pink-soft); margin-top: -10px; margin-bottom: 15px;"></p>

      <button class="btn-publish" id="tombolTambahProjek">Tambah Projek</button>
      <button class="btn-secondary" id="tombolBatalEdit" style="display: none;">Batal Edit</button>
      <button class="btn-secondary" id="tombolLogout">Logout</button>
    </div>

    <div id="listWrap" class="admin-list" style="display: none">
      <div class="admin-list-head">
        <div>Nama</div>
        <div>Deskripsi</div>
        <div>Aksi</div>
      </div>
      <div id="daftarProjekAdmin"></div>
    </div>

    <div id="modalHapus" style="display: none">
      <div class="modal-box">
        <p>Yakin mau hapus projek ini?</p>
        <button id="modalHapusYa">Ya, Hapus</button>
        <button id="modalHapusBatal">Batal</button>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc,
        doc,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import {
        getStorage,
        ref,
        uploadBytesResumable,
        getDownloadURL
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBpkPJYOVqRZ1POS3raJvZw9lTDGsovvSQ",
        authDomain: "portofolio-sandi.firebaseapp.com",
        projectId: "portofolio-sandi",
        storageBucket: "portofolio-sandi.firebasestorage.app",
        messagingSenderId: "532734362143",
        appId: "1:532734362143:web:e68fa01efc05a994db8b2a",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      const storage = getStorage(app);

      window.db = db;
      window.firestoreFns = { collection, getDocs, addDoc, updateDoc, deleteDoc, doc };
      window.auth = auth;
      window.authFns = {
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
      };
      window.storage = storage;
      window.storageFns = { ref, uploadBytesResumable, getDownloadURL };
    </script>
    <script src="admin.js" defer></script>
  </body>
</html>
